[project]
name = "stem-alt"
version = "0.1.0"
description = "STEM-Alt: An Adversarial Generator-Critic Loop with Human-Aligned Review for STEM Alt-Text."
authors = [
    { name = "Arvid E. Gollwitzer", email = "arvidg@mit.edu" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "torch>=2.2",
    "transformers>=4.42",
    "peft>=0.11",
    "trl>=0.9",
    "accelerate>=0.30",
    "Pillow>=10.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "krippendorff>=0.6",
    "openai>=1.30",
    "anthropic>=0.30",
    "google-generativeai>=0.5",
    "tenacity>=8.2",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
accessibility = [
    "axe-selenium-python>=2.1",
    "playwright>=1.45",
]
analysis = [
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pubfig>=0.3",
    "pubtab>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stem_alt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "D"]
ignore = ["ANN101", "ANN102", "D203", "D213"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
